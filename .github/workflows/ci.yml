name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Build and lint only on ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Test on ubuntu-24.04 with multiple PostgreSQL versions
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 19beta2 は PostgreSQL 19 リリース (2026 年 9 月頃) までの仮タグ。
        # リリース後は 19 に変更する。
        postgres-version: [19beta2, 18, 17, 16]
    env:
      POSTGRES_VERSION: ${{ matrix.postgres-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install system dependencies
        # Install tools required for building aws-lc-rs from source if needed
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake golang-go

      - name: Run tests
        run: cargo test --workspace
