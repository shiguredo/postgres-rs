[workspace]
resolver = "3"
members = ["postgres", "postgres-core"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/shiguredo/postgres-rs"
license = "Apache-2.0"

[workspace.dependencies]
# 日付・時刻型
chrono = { version = "0.4", features = ["std"] }
# ログ出力
tracing = "0.1"
# テスト時の tracing ログ出力
tracing-subscriber = "0.3"
